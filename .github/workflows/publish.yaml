name: Publish to npm
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to publish, e.g. v0.3.0
                required: true
permissions:
    contents: read
    id-token: write
jobs:
    publish:
        runs-on: ubuntu-latest
        name: Publish to npm
        steps:
            - name: Check out the release
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name || inputs.tag }}

            - uses: oven-sh/setup-bun@v2

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            # Trusted publishing needs npm 11.5.1 or later.
            - run: npm install -g npm@latest

            - run: bun install --frozen-lockfile

            - name: Tag matches package.json
              env:
                  TAG: ${{ github.event.release.tag_name || inputs.tag }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$version" != "$TAG" ]; then
                      echo "::error::tag is $TAG but package.json says $version"
                      exit 1
                  fi

            - name: Types and tests
              run: bunx tsc --noEmit -p tsconfig.json && bun test

            - name: Skip if this version is already on npm
              id: published
              run: |
                  spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
                  if npm view "$spec" version >/dev/null 2>&1; then
                      echo "::notice::$spec is already on npm, nothing to publish"
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            - run: bun run build
              if: steps.published.outputs.skip != 'true'

            - run: npm publish --provenance --access public
              if: steps.published.outputs.skip != 'true'
